<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENA DevSuite 2026</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="estilos.css">

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/dist/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

  <div id="app" class="container my-5">
    
    <div class="d-flex align-items-center justify-content-between mb-4 p-3 main-card">
      <div class="d-flex align-items-center gap-3">
        <div class="p-3 rounded-3 text-info" style="background-color: rgba(14, 165, 233, 0.1);">
          <i class="fa-solid fa-laptop-code fa-2x"></i>
        </div>
        <div>
          <h2 class="m-0 fw-bold text-white">SENA DevSuite 2026</h2>
          <p class="m-0 text-white-50 small">Herramientas de Automatización en Arquitectura de Servidor Local</p>
        </div>
      </div>
      <span class="badge bg-dark border border-secondary px-3 py-2 text-info font-monospace">v3.0.0-Local</span>
    </div>

    <div class="d-flex justify-content-center mb-4">
      <ul class="nav nav-pills gap-2 p-2 bg-dark bg-opacity-50 rounded-3 border border-secondary border-opacity-25">
        <li class="nav-item">
          <button class="nav-link" :class="{ active: mainTab === 'ad' }" @click="mainTab = 'ad'">
            <i class="fa-solid fa-crosshairs me-2"></i>Actividad Didáctica (AD)
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" :class="{ active: mainTab === 'config' }" @click="mainTab = 'config'">
            <i class="fa-solid fa-book-bookmark me-2"></i>Componente Autónomo (Config)
          </button>
        </li>
      </ul>
    </div>

    <component-ad v-if="mainTab === 'ad'"></component-ad>
    <component-config v-if="mainTab === 'config'"></component-config>

  </div>

  <script type="module">
    import ActividadInjector from './src/components/ActividadInjector.js';
    import ConfigEstructurador from './src/components/ConfigEstructurador.js';

    const { createApp, ref } = Vue;

    createApp({
      components: {
        'component-ad': ActividadInjector,
        'component-config': ConfigEstructurador
      },
      setup() {
        const mainTab = ref('ad');
        return { mainTab };
      }
    }).mount('#app');
  </script>
</body>
</html>
